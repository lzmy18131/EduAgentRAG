# ==================== MySQL 配置 ====================
[mysql]
host = localhost
user = root
password = 
database = subjects_kg

# ==================== Redis 配置 ====================
[redis]
host = localhost
port = 6379
password = 
db = 0

# ==================== Milvus 向量库配置（后续 RAG 阶段使用）====================
[milvus]
host = localhost
port = 19530
database_name = itcast
collection_name = edurag_0421

# ==================== LLM 大模型配置 (Kimi K3 via DashScope) ====================
[llm]
model = deepseek-v4-pro
api_key = 
base_url = https://api.deepseek.com

# ==================== 检索分块参数（父子分块优化）====================
[retrieval]
parent_chunk_size = 1200
child_chunk_size = 300
chunk_overlap = 80
retrieval_k = 5
candidate_m = 3
dense_weight = 0.7
sparse_weight = 0.3
rerank_pool_multiplier = 15
ranker_type = rrf
rrf_k = 60
context_compress_enabled = true
context_max_chars = 12000

# ==================== 日志配置 ====================
[logger]
log_file = logs/app.log

# ==================== 应用配置 ====================
[app]
valid_sources = ["ai", "java", "test", "ops", "bigdata"]
customer_service_phone = 12345678
